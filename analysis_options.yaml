# Статический анализ проекта. Запускается в CI: `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  errors:
    # Деньги в проекте — только int (тийины). Случайное использование double
    # в расчётах должно быть заметно, поэтому часть подсказок поднята до ошибок.
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error
    todo: ignore

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Качество кода
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    unnecessary_parenthesis: true

    # Защита от ошибок в денежных и асинхронных расчётах
    avoid_double_and_int_checks: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true

    # Стиль
    directives_ordering: true
    require_trailing_commas: true
    sort_child_properties_last: true
